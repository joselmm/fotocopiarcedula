<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Fotocopia IA - Recorte Preciso</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6fa; margin: 0; padding: 0; }
    .toolbar { background: #2f3640; color: white; padding: 15px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .toolbar label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .root { display: flex; justify-content: center; margin-top: 20px; padding-bottom: 40px; }
    canvas { border: 1px solid #dcdde1; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white; }
    button { background: #44bd32; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background: #4cd137; transform: translateY(-1px); }
    input[type="file"] { width: 150px; }
  </style>
</head>

<body>
  <div class="toolbar">
    <label>🗂️ Frontal: <input type="file" id="frontInput" accept="image/*"></label>
    <label>🗂️ Trasera: <input type="file" id="backInput" accept="image/*"></label>
    <label><input type="checkbox" id="cropCheckbox" checked> ✨ Auto Recorte (IA)</label>
    <label><input type="checkbox" id="scale150" checked> 🔍 Aumentar 150%</label>
    <label><input type="checkbox" id="grayCheckbox" checked> ⚪ B/N</label>
    <button id="printBtn" onclick="window.print()">🖨️ Imprimir</button>
  </div>

  <div class="root">
    <canvas id="c" width="816" height="1056"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <script>
    const canvas = new fabric.Canvas('c', { backgroundColor: 'white' });
    const cmToPx = cm => cm * 96 / 2.54;
    const CARD_W_REAL = cmToPx(8.56); // Tamaño estándar cédula
    const GAP_PX = cmToPx(1.5);
    
    let frontImg, backImg;
    let onnxSession = null;
    const MODEL_PATH = 'models/best.onnx';
    const MODEL_SIZE = 1024;

    // 1. Cargar Modelo ONNX
    ort.InferenceSession.create(MODEL_PATH).then(sess => {
      onnxSession = sess;
      console.log('✅ Modelo ONNX cargado correctamente');
    }).catch(err => console.error('❌ Error cargando ONNX:', err));

    // 2. Preprocesamiento para el modelo
    function letterboxToModel(img, modelSize) {
      const mCanvas = document.createElement('canvas');
      mCanvas.width = mCanvas.height = modelSize;
      const ctx = mCanvas.getContext('2d');
      ctx.fillStyle = 'rgb(114,114,114)'; 
      ctx.fillRect(0, 0, modelSize, modelSize);
      
      const scale = Math.min(modelSize / img.width, modelSize / img.height);
      const newW = img.width * scale;
      const newH = img.height * scale;
      const padX = (modelSize - newW) / 2;
      const padY = (modelSize - newH) / 2;
      
      ctx.drawImage(img, padX, padY, newW, newH);
      return { canvas: mCanvas, scale, padX, padY };
    }

    // 3. Convertir a Tensor
    function imgToTensor(canvas) {
      const ctx = canvas.getContext('2d');
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const f32 = new Float32Array(3 * canvas.width * canvas.height);
      for (let i = 0; i < canvas.width * canvas.height; i++) {
        f32[i] = data[i * 4] / 255.0; // R
        f32[i + canvas.width * canvas.height] = data[i * 4 + 1] / 255.0; // G
        f32[i + 2 * canvas.width * canvas.height] = data[i * 4 + 2] / 255.0; // B
      }
      return new ort.Tensor('float32', f32, [1, 3, canvas.width, canvas.height]);
    }

    // 4. Recorte Directo (Sin rotación matemática fallida)
    function cropImageByKpts(img, kpts, pad = 20) {
      const xs = kpts.map(p => p.x);
      const ys = kpts.map(p => p.y);
      const minX = Math.max(0, Math.min(...xs) - pad);
      const minY = Math.max(0, Math.min(...ys) - pad);
      const maxX = Math.min(img.width, Math.max(...xs) + pad);
      const maxY = Math.min(img.height, Math.max(...ys) + pad);

      const out = document.createElement('canvas');
      out.width = maxX - minX; out.height = maxY - minY;
      const ctx = out.getContext('2d');
      ctx.drawImage(img, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
      return out;
    }

    // 5. Preparar objeto FabricJS
    function prepareFabricImg(imgObj) {
      const isScale150 = document.getElementById('scale150').checked;
      const isGray = document.getElementById('grayCheckbox').checked;

      imgObj.set({ originX: 'center', originY: 'center', selectable: true, hasControls: true });
      
      const targetWidth = isScale150 ? CARD_W_REAL * 1.5 : CARD_W_REAL;
      imgObj.scaleToWidth(targetWidth);

      if (isGray) {
        imgObj.filters.push(new fabric.Image.filters.Grayscale());
        imgObj.applyFilters();
      }
      return imgObj;
    }

    async function processImage(file, isFront) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      await new Promise(res => reader.onload = res);
      
      const img = new Image();
      img.src = reader.result;
      await new Promise(res => img.onload = res);

      let finalSource = reader.result;

      if (onnxSession && document.getElementById('cropCheckbox').checked) {
        const pre = letterboxToModel(img, MODEL_SIZE);
        const tensor = imgToTensor(pre.canvas);
        const feeds = { [onnxSession.inputNames[0]]: tensor };
        const results = await onnxSession.run(feeds);
        const output = results[onnxSession.outputNames[0]].data;
        const dims = results[onnxSession.outputNames[0]].dims[2];

        // Buscar la mejor detección (conf > 0.5)
        let bestScore = 0;
        let bestKpts = null;

        for (let i = 0; i < 100; i++) {
          const score = output[i * dims + 4];
          if (score > 0.5 && score > bestScore) {
            bestScore = score;
            bestKpts = [];
            for (let k = 0; k < 4; k++) {
              let x = (output[i * dims + 6 + k * 2] - pre.padX) / pre.scale;
              let y = (output[i * dims + 7 + k * 2] - pre.padY) / pre.scale;
              bestKpts.push({ x, y });
            }
          }
        }

        if (bestKpts) {
          const croppedCanvas = cropImageByKpts(img, bestKpts);
          finalSource = croppedCanvas.toDataURL();
        }
      }

      fabric.Image.fromURL(finalSource, imgObj => {
        imgObj = prepareFabricImg(imgObj);
        if (isFront) {
          if (frontImg) canvas.remove(frontImg);
          frontImg = imgObj;
        } else {
          if (backImg) canvas.remove(backImg);
          backImg = imgObj;
        }
        canvas.add(imgObj);
        alignImages();
      });
    }

    function alignImages() {
      if (!frontImg || !backImg) return;
      const cx = canvas.width / 2;
      const totalH = frontImg.getScaledHeight() + GAP_PX + backImg.getScaledHeight();
      const startY = (canvas.height - totalH) / 2;

      frontImg.set({ left: cx, top: startY + frontImg.getScaledHeight() / 2 });
      backImg.set({ left: cx, top: startY + frontImg.getScaledHeight() + GAP_PX + backImg.getScaledHeight() / 2 });
      
      canvas.renderAll();
    }

    // Eventos
    document.getElementById('frontInput').onchange = e => e.target.files[0] && processImage(e.target.files[0], true);
    document.getElementById('backInput').onchange = e => e.target.files[0] && processImage(e.target.files[0], false);
    console.log("codigo 12:32")
  </script>
</body>
</html>
