<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Fotocopia Opcional</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f6fa; margin: 0; padding: 0; }
    .toolbar { background: #2f3640; color: white; padding: 10px; display: flex; gap: 20px; align-items: center; justify-content: center; }
    .toolbar label { display: flex; align-items: center; gap: 5px; font-size: 14px; }
    .root { display: flex; justify-content: center; margin-top: 10px; }
    canvas { border: 1px solid #ccc; }
    button { background: #44bd32; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    button:hover { background: #4cd137; }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0); z-index: 10; }
  </style>
  <link rel="shortcut icon" href="./favicon.png" type="image/x-icon">
</head>

<body>
  <div class="toolbar">
    <label>Frontal: <input type="file" id="frontInput" accept="image/*"></label>
    <label>Trasera: <input type="file" id="backInput" accept="image/*"></label>
    <label><input checked type="checkbox" id="cropCheckbox"> Recortar cédula</label>
    <label><input type="checkbox" id="scale150" checked> Aumentar 150%</label>
    <label><input type="checkbox" id="gray" checked> Escala de grises</label>
    <button id="printBtn">Imprimir</button>
  </div>

  <div class="root" style="position: relative;">
    <canvas id="c" width="816" height="1056"></canvas>
    <div id="overlay"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script>
    const canvas = new fabric.Canvas('c', { backgroundColor: 'white', selection: false });
    const cmToPx = cm => cm * 96 / 2.54;
    const CARD_W_REAL = cmToPx(8.5);
    const GAP_PX = cmToPx(1.5);
    const NAPKIN_URL = 'https://josealfredosoraca.npkn.net/e43504/';
    
    let frontImg, backImg;
    let onnxSession = null;
    const MODEL_PATH = 'models/best.onnx';
    const MODEL_SIZE = 1024;

    ort.InferenceSession.create(MODEL_PATH).then(sess => {
      onnxSession = sess;
      console.log('ONNX model loaded');
    }).catch(err => console.error('Error loading ONNX model:', err));

    function prepare(img, scale150, gray) {
      // Si el recorte viene de Python, ya viene horizontal, pero por si acaso:
      if (img.height > img.width) img.set({ angle: -90 });
      
      img.set({ originX: 'center', originY: 'center', selectable: true, hasControls: true });
      const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      const targetWidth = scale150 
        ? CARD_W_REAL * 1.5 * (isTouchDevice ? 1.125 : 1) 
        : CARD_W_REAL * (isTouchDevice ? 1.125 : 1);
      
      img.scaleToWidth(targetWidth);

      if (gray) {
        const grayFilter = new fabric.Image.filters.Grayscale();
        img.filters.push(grayFilter);
        img.applyFilters();
      }

      img.setCoords();
      return img;
    }

    function placeBoth() {
      if (!frontImg || !backImg) return;
      const h1 = frontImg.getScaledHeight();
      const h2 = backImg.getScaledHeight();
      const total = h1 + GAP_PX + h2;
      const cx = canvas.width / 2;
      const startY = (canvas.height - total) / 2;
      frontImg.set({ left: cx, top: startY + h1/2 });
      backImg.set({ left: cx, top: startY + h1 + GAP_PX + h2/2 });
      canvas.renderAll();
    }

    function letterboxToModel(img, modelSize) {
      const mCanvas = document.createElement('canvas');
      mCanvas.width = mCanvas.height = modelSize;
      const mctx = mCanvas.getContext('2d');
      mctx.fillStyle = 'rgb(114,114,114)'; mctx.fillRect(0,0,modelSize,modelSize);
      const scale = Math.min(modelSize / img.width, modelSize / img.height);
      const newW = Math.round(img.width * scale);
      const newH = Math.round(img.height * scale);
      const padX = Math.floor((modelSize - newW) / 2);
      const padY = Math.floor((modelSize - newH) / 2);
      mctx.drawImage(img, padX, padY, newW, newH);
      return { canvas: mCanvas, scale, padX, padY };
    }

    function imageDataToCHWFloat32(imageData, modelW, modelH) {
      const data = imageData.data;
      const hw = modelW * modelH;
      const f32 = new Float32Array(3 * hw);
      for (let i = 0, p = 0; i < hw; i++, p+=4) {
        f32[i] = data[p] / 255.0;
        f32[i + hw] = data[p+1] / 255.0;
        f32[i + 2*hw] = data[p+2] / 255.0;
      }
      return f32;
    }

    async function processImage(file, isFront) {
      const scale150 = document.getElementById('scale150').checked;
      const gray = document.getElementById('gray').checked;
      const reader = new FileReader();
      reader.readAsDataURL(file);
      await new Promise(res => reader.onload = res);
      
      const img = new Image();
      img.src = reader.result;
      await new Promise(res => img.onload = res);

      if (onnxSession && document.getElementById('cropCheckbox').checked) {
        const pre = letterboxToModel(img, MODEL_SIZE);
        const inputData = imageDataToCHWFloat32(pre.canvas.getContext('2d').getImageData(0, 0, MODEL_SIZE, MODEL_SIZE), MODEL_SIZE, MODEL_SIZE);
        const tensor = new ort.Tensor('float32', inputData, [1, 3, MODEL_SIZE, MODEL_SIZE]);
        
        const inputName = onnxSession.inputNames[0];
        const results = await onnxSession.run({ [inputName]: tensor });
        const outKey = onnxSession.outputNames[0];
        const outData = results[outKey].data;
        const [bs, maxDet, D] = results[outKey].dims;

        const dets = [];
        for (let d = 0; d < maxDet; d++) {
          const base = d * D;
          const score = outData[base + 4];
          if (score > 0.5) {
            const kpts = [];
            for (let k = 0; k < 4; k++) {
              const kx = (outData[base + 6 + 2*k] - pre.padX) / pre.scale;
              const ky = (outData[base + 6 + 2*k + 1] - pre.padY) / pre.scale;
              kpts.push({ x: kx, y: ky });
            }
            dets.push({ score, kpts });
          }
        }

        if (dets.length > 0) {
          const best = dets.sort((a,b) => b.score - a.score)[0];
          
          // --- LLAMADA AL BACKEND DE NAPKIN (PYTHON/OPENCV) ---
          try {
            const response = await fetch(NAPKIN_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                image: reader.result,
                kpts: best.kpts
              })
            });
            const resData = await response.json();
            
            if (resData.status === 'ok') {
              fabric.Image.fromURL(resData.image, obj => {
                obj = prepare(obj, scale150, gray);
                if (isFront) { if(frontImg) canvas.remove(frontImg); frontImg = obj; }
                else { if(backImg) canvas.remove(backImg); backImg = obj; }
                canvas.add(obj); placeBoth();
              });
              return;
            }
          } catch (e) {
            console.error("Error llamando a Napkin:", e);
          }
        }
      }

      // Fallback si no hay modelo o falla el recorte
      fabric.Image.fromURL(reader.result, obj => {
        obj = prepare(obj, scale150, gray);
        if (isFront) { if(frontImg) canvas.remove(frontImg); frontImg = obj; }
        else { if(backImg) canvas.remove(backImg); backImg = obj; }
        canvas.add(obj); placeBoth();
      });
    }

    document.getElementById('frontInput').onchange = e => e.target.files[0] && processImage(e.target.files[0], true);
    document.getElementById('backInput').onchange = e => e.target.files[0] && processImage(e.target.files[0], false);
    document.getElementById('printBtn').onclick = () => window.print();

  </script>
  <script src="./js/print.js"></script>
</body>
</html>
