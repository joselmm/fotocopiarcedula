<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Fotocopia Opcional</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f6fa; margin: 0; padding: 0; }
    .toolbar { background: #2f3640; color: white; padding: 10px; display: flex; gap: 20px; align-items: center; justify-content: center; }
    .toolbar label { display: flex; align-items: center; gap: 5px; font-size: 14px; }
    .root { display: flex; justify-content: center; margin-top: 10px; }
    canvas { border: 1px solid #ccc; }
    button { background: #44bd32; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    button:hover { background: #4cd137; }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0); z-index: 10; }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>Frontal: <input type="file" id="frontInput" accept="image/*"></label>
    <label>Trasera: <input type="file" id="backInput" accept="image/*"></label>
    <label><input checked type="checkbox" id="cropCheckbox"> Recortar cédula</label>
    <label><input type="checkbox" id="scale150" checked> Aumentar 150%</label>
    <label><input type="checkbox" id="gray" checked> Escala de grises</label>
    <button id="printBtn">Imprimir</button>
  </div>

  <div class="root" style="position: relative;">
    <canvas id="c" width="816" height="1056"></canvas>
    <div id="overlay"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script>
    const canvas = new fabric.Canvas('c', { backgroundColor: 'white', selection: false });
    const cmToPx = cm => cm * 96 / 2.54;
    const CARD_W_REAL = cmToPx(8.5);
    const GAP_PX = cmToPx(1.5);
    let frontImg, backImg;
    let onnxSession = null;
    const MODEL_PATH = 'models/best.onnx';
    const MODEL_SIZE = 1024;

    ort.InferenceSession.create(MODEL_PATH).then(sess => {
      onnxSession = sess;
      console.log('ONNX model loaded');
    }).catch(err => console.error('Error:', err));

    function prepare(img, scale150, gray) {
      if (img.height > img.width) img.set({ angle: -90 });
      img.set({ originX: 'center', originY: 'center', selectable: true, hasControls: true });
      const targetWidth = scale150 ? CARD_W_REAL * 1.5 : CARD_W_REAL;
      img.scaleToWidth(targetWidth);
      if (gray) {
        img.filters.push(new fabric.Image.filters.Grayscale());
        img.applyFilters();
      }
      img.setCoords();
      return img;
    }

    function placeBoth() {
      if (!frontImg || !backImg) return;
      const h1 = frontImg.getScaledHeight();
      const h2 = backImg.getScaledHeight();
      const total = h1 + GAP_PX + h2;
      const cx = canvas.width / 2;
      const startY = (canvas.height - total) / 2;
      frontImg.set({ left: cx, top: startY + h1/2 });
      backImg.set({ left: cx, top: startY + h1 + GAP_PX + h2/2 });
      canvas.renderAll();
    }

    function letterboxToModel(img, modelSize) {
      const mCanvas = document.createElement('canvas');
      mCanvas.width = mCanvas.height = modelSize;
      const mctx = mCanvas.getContext('2d');
      mctx.fillStyle = 'rgb(114,114,114)'; mctx.fillRect(0,0,modelSize,modelSize);
      const scale = Math.min(modelSize / img.width, modelSize / img.height);
      const newW = Math.round(img.width * scale), newH = Math.round(img.height * scale);
      const padX = (modelSize - newW) / 2, padY = (modelSize - newH) / 2;
      mctx.drawImage(img, padX, padY, newW, newH);
      return { canvas: mCanvas, scale, padX, padY };
    }

    function imageDataToCHWFloat32(imageData, w, h) {
      const data = imageData.data, f32 = new Float32Array(3 * w * h);
      for (let i = 0, p = 0; i < w * h; i++, p+=4) {
        f32[i] = data[p]/255; f32[i+w*h] = data[p+1]/255; f32[i+2*w*h] = data[p+2]/255;
      }
      return f32;
    }

    // MEJORA: Promedia el ángulo de los bordes superior e inferior para más precisión
    function estimateTopEdgeAngleFromKpts(kpts) {
      const sortedY = [...kpts].sort((a,b) => a.y - b.y);
      const top = sortedY.slice(0,2).sort((a,b) => a.x - b.x);
      const bot = sortedY.slice(2,4).sort((a,b) => a.x - b.x);
      
      const angleTop = Math.atan2(top[1].y - top[0].y, top[1].x - top[0].x);
      const angleBot = Math.atan2(bot[1].y - bot[0].y, bot[1].x - bot[0].x);
      
      return (angleTop + angleBot) / 2; // Promedio para estabilizar
    }

    function rotateCanvas(srcCanvas, theta) {
      const w = srcCanvas.width, h = srcCanvas.height;
      const cos = Math.abs(Math.cos(theta)), sin = Math.abs(Math.sin(theta));
      const rotW = w * cos + h * sin, rotH = w * sin + h * cos;
      const out = document.createElement('canvas');
      out.width = rotW; out.height = rotH;
      const ctx = out.getContext('2d');
      ctx.translate(rotW/2, rotH/2); ctx.rotate(theta);
      ctx.drawImage(srcCanvas, -w/2, -h/2);
      return out;
    }

    function cropRotateTight(img, kpts) {
      const xs = kpts.map(p => p.x), ys = kpts.map(p => p.y);
      const minX = Math.min(...xs), minY = Math.min(...ys), maxX = Math.max(...xs), maxY = Math.max(...ys);
      const sw = maxX - minX, sh = maxY - minY;
      
      const cropped = document.createElement('canvas');
      cropped.width = sw; cropped.height = sh;
      cropped.getContext('2d').drawImage(img, minX, minY, sw, sh, 0, 0, sw, sh);
      
      const theta = -estimateTopEdgeAngleFromKpts(kpts.map(p => ({x: p.x - minX, y: p.y - minY})));
      const rotated = rotateCanvas(cropped, theta);
      
      // Recorte final para quitar bordes negros tras rotar
      return rotated; 
    }

    async function processImage(file, isFront) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      await new Promise(res => reader.onload = res);
      const img = new Image(); img.src = reader.result;
      await new Promise(res => img.onload = res);

      if (onnxSession && document.getElementById('cropCheckbox').checked) {
        const pre = letterboxToModel(img, MODEL_SIZE);
        const tensor = new ort.Tensor('float32', imageDataToCHWFloat32(pre.canvas.getContext('2d').getImageData(0,0,MODEL_SIZE,MODEL_SIZE), MODEL_SIZE, MODEL_SIZE), [1,3,MODEL_SIZE,MODEL_SIZE]);
        const results = await onnxSession.run({ [onnxSession.inputNames[0]]: tensor });
        const outData = results[onnxSession.outputNames[0]].data;
        const D = results[onnxSession.outputNames[0]].dims[2];

        let best = null, maxScore = 0;
        for (let d=0; d<100; d++) {
          const score = outData[d*D+4];
          if (score > 0.4 && score > maxScore) {
            maxScore = score;
            best = [];
            for (let k=0; k<4; k++) {
              best.push({ x: (outData[d*D+6+2*k] - pre.padX)/pre.scale, y: (outData[d*D+7+2*k] - pre.padY)/pre.scale });
            }
          }
        }
        if (best) {
          const finalCanvas = cropRotateTight(img, best);
          fabric.Image.fromURL(finalCanvas.toDataURL(), obj => {
            obj = prepare(obj, document.getElementById('scale150').checked, document.getElementById('gray').checked);
            if (isFront) { if(frontImg) canvas.remove(frontImg); frontImg = obj; }
            else { if(backImg) canvas.remove(backImg); backImg = obj; }
            canvas.add(obj); placeBoth();
          });
          return;
        }
      }
      // Fallback si no hay detección
      fabric.Image.fromURL(reader.result, obj => {
        obj = prepare(obj, document.getElementById('scale150').checked, document.getElementById('gray').checked);
        if (isFront) { if(frontImg) canvas.remove(frontImg); frontImg = obj; }
        else { if(backImg) canvas.remove(backImg); backImg = obj; }
        canvas.add(obj); placeBoth();
      });
    }

    document.getElementById('frontInput').onchange = e => e.target.files[0] && processImage(e.target.files[0], true);
    document.getElementById('backInput').onchange = e => e.target.files[0] && processImage(e.target.files[0], false);
    document.getElementById('printBtn').onclick = () => window.print();
  </script>
</body>
</html>
